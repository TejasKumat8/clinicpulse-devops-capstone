# ClinicPulse CI/CD Delivery Pipeline
#
#   QUALITY GATES ──► CONTAINER BUILD + TRIVY CVE SCAN ──► GHCR PUSH (SHA) ──► HELM DEPLOY (EKS)
#
# Every gate must pass before images are built; Trivy blocks any fixable HIGH/CRITICAL CVEs.
name: ClinicPulse CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: clinicpulse-eks
  HELM_VERSION: v3.16.0
  K8S_NAMESPACE: clinicpulse

jobs:
  # ───────────────────────────── 1. QUALITY GATES ─────────────────────────────
  backend-tests:
    name: Backend · Lint + Pytest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Code quality linting (Ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Run Pytest test suite (In-memory SQLite isolation)
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml --junitxml=pytest-report.xml
      - name: Archive backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/pytest-report.xml
            backend/coverage.xml

  postgres-integration:
    name: Backend · Alembic Migrations & Postgres Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clinicpulse_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d clinicpulse_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci_password@localhost:5432/clinicpulse_ci
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci_password@localhost:5432/clinicpulse_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Verify migration reversibility (upgrade -> downgrade -> upgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current
      - name: Run Pytest integration tests against live PostgreSQL
        run: pytest -q

  frontend-build:
    name: Frontend · Unit Tests + Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  infra-validate:
    name: IaC · Terraform Validate + Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Validate Terraform configurations
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Lint Helm Chart templates
        run: |
          helm lint helm/clinicpulse
          helm lint helm/clinicpulse -f helm/clinicpulse/values-prod.yaml
          helm template clinicpulse helm/clinicpulse -f helm/clinicpulse/values-prod.yaml > /dev/null

  # ────────────────── 2. CONTAINER BUILD + TRIVY SCAN + GHCR PUSH ──────────────────
  build-scan-push:
    name: Container · ${{ matrix.service }}
    needs: [backend-tests, postgres-integration, frontend-build, infra-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase repository image tag
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${owner}/clinicpulse-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build container image (Git SHA tag)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Security Gate: Blocks images containing fixable HIGH/CRITICAL vulnerabilities
      - name: Trivy vulnerability scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

      - name: Generate SARIF security scan report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          exit-code: "0"

      - name: Upload SARIF report to GitHub Advanced Security
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Authenticate to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable image tag to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ steps.meta.outputs.image }}:${{ github.sha }}"
          {
            echo "### 📦 ${{ matrix.service }} image published"
            echo '```'
            echo "${{ steps.meta.outputs.image }}:${{ github.sha }}"
            echo '```'
            echo "Trivy Vulnerability Gate: **Passed (0 Fixable High/Critical CVEs)**"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────── 3. CONTINUOUS DEPLOYMENT ─────────────────────────────
  deploy:
    name: Continuous Deployment · Helm → EKS
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.smoke.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl context for EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Deploy Helm Chart with automated rollback
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          kubectl apply -f k8s/namespace.yaml
          helm upgrade --install clinicpulse ./helm/clinicpulse \
            --namespace "$K8S_NAMESPACE" \
            -f helm/clinicpulse/values-prod.yaml \
            --set backend.image.repository="ghcr.io/${owner}/clinicpulse-backend" \
            --set backend.image.tag="${GITHUB_SHA}" \
            --set frontend.image.repository="ghcr.io/${owner}/clinicpulse-frontend" \
            --set frontend.image.tag="${GITHUB_SHA}" \
            --set postgres.auth.password="${{ secrets.POSTGRES_PASSWORD || 'clinicpulse-secret-pwd' }}" \
            --rollback-on-failure --timeout 10m
          helm list -n "$K8S_NAMESPACE"
          kubectl get pods,svc,ingress,hpa -n "$K8S_NAMESPACE"

      - name: Deployment smoke test (Validates Git SHA live through Ingress)
        id: smoke
        run: |
          host=""
          for i in $(seq 1 30); do
            host=$(kubectl get svc -n ingress-nginx ingress-nginx-controller \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            [ -n "$host" ] && break
            sleep 10
          done
          echo "url=http://${host}" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            sha=$(curl -fsS "http://${host}/api/info" | jq -r .gitSha || true)
            if [ "$sha" = "$GITHUB_SHA" ]; then
              echo "✅ http://${host} verified serving commit ${sha}" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for build rollout (current: ${sha:-unreachable})"; sleep 10
          done
          echo "Rollout verification timed out" >&2
          exit 1
