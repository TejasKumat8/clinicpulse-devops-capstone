apiVersion: v1
kind: Service
metadata:
  name: {{ include "clinicpulse.postgresName" . }}
  labels:
    {{- include "clinicpulse.componentLabels" (dict "ctx" . "component" "database") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "clinicpulse.selectorLabels" (dict "ctx" . "component" "database") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "clinicpulse.postgresName" . }}
  labels:
    {{- include "clinicpulse.componentLabels" (dict "ctx" . "component" "database") | nindent 4 }}
spec:
  serviceName: {{ include "clinicpulse.postgresName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "clinicpulse.selectorLabels" (dict "ctx" . "component" "database") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clinicpulse.componentLabels" (dict "ctx" . "component" "database") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/db-secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: {{ include "clinicpulse.dbSecretName" . }}, key: postgres-database}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ include "clinicpulse.dbSecretName" . }}, key: postgres-user}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "clinicpulse.dbSecretName" . }}, key: postgres-password}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "clinicpulse.componentLabels" (dict "ctx" . "component" "database") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ .Values.postgres.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
  {{- else }}
      volumes:
        - name: data
          emptyDir: {}
  {{- end }}
